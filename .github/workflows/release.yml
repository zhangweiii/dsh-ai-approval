name: Release

# Push a tag matching package.json to publish automatically:
#   v0.1.0        -> npm "latest" + stable GitHub Release
#   v0.1.0-rc.8   -> npm "next" + prerelease GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # npm trusted publishing requires npm >= 11.5.1.
      - run: npm install --global npm@11.12.1
      - run: pnpm install --frozen-lockfile

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi
          pnpm release:check
          VERSION_WITHOUT_BUILD=${VERSION%%+*}
          case "$VERSION_WITHOUT_BUILD" in
            *-*)
              echo "dist_tag=next" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${VERSION} already exists on npm; skipping npm publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Publishing ${PACKAGE_NAME}@${VERSION}"
          fi

      - name: Pack release artifacts
        shell: bash
        run: |
          rm -rf release-artifacts
          mkdir release-artifacts
          pnpm --silent sbom > release-artifacts/sbom.cdx.json
          npm pack --pack-destination release-artifacts
          (cd release-artifacts && sha256sum *.tgz sbom.cdx.json > SHA256SUMS)

      - name: Verify checksums and smoke-test the exact release tarball
        run: |
          (cd release-artifacts && sha256sum -c SHA256SUMS)
          node scripts/package-smoke.mjs release-artifacts/*.tgz

      - name: Verify an existing npm version matches the exact tarball
        if: steps.meta.outputs.already_published == 'true'
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p npm-registry-artifact
          npm pack "${PACKAGE_NAME}@${VERSION}" --pack-destination npm-registry-artifact
          if ! cmp --silent release-artifacts/*.tgz npm-registry-artifact/*.tgz; then
            echo "npm ${PACKAGE_NAME}@${VERSION} does not match this tag's tarball" >&2
            exit 1
          fi

      - name: Publish exact tarball to npm with provenance
        if: steps.meta.outputs.already_published != 'true'
        run: npm publish release-artifacts/*.tgz --tag "${{ steps.meta.outputs.dist_tag }}" --access public --provenance

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Verify downloaded release checksums
        working-directory: release-artifacts
        run: sha256sum -c SHA256SUMS
      - name: Create GitHub Release and attach verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
            if [ "$IS_PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${args[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          expected=$(for artifact in release-artifacts/*; do basename "$artifact"; done)
          unexpected=$(comm -23 <(printf '%s\n' "$existing" | sort -u) <(printf '%s\n' "$expected" | sort -u))
          if [ -n "$unexpected" ]; then
            echo "GitHub Release contains unexpected unverified assets:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          mkdir -p existing-release-assets
          for artifact in release-artifacts/*; do
            name=$(basename "$artifact")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir existing-release-assets
              if ! cmp --silent "$artifact" "existing-release-assets/$name"; then
                echo "GitHub Release asset ${name} does not match this tag's artifact" >&2
                exit 1
              fi
              echo "GitHub Release asset ${name} already exists and matches"
            else
              gh release upload "$GITHUB_REF_NAME" "$artifact" --repo "$GITHUB_REPOSITORY"
            fi
          done
