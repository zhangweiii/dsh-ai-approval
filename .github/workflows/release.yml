name: Release

# Push a tag matching package.json to publish automatically:
#   v0.1.0        -> npm "latest" + stable GitHub Release
#   v0.1.0-rc.8   -> npm "next" + prerelease GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/secret-scan.mjs
      - run: pnpm audit --prod --audit-level=high

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # npm trusted publishing requires npm >= 11.5.1.
      - run: npm install --global npm@11.12.1
      - run: pnpm install --frozen-lockfile

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi
          pnpm release:check
          case "$VERSION" in
            *-*)
              echo "dist_tag=next" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${VERSION} already exists on npm; skipping npm publish"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Publishing ${PACKAGE_NAME}@${VERSION}"
          fi

      - name: Publish to npm with provenance
        if: steps.meta.outputs.already_published != 'true'
        run: npm publish --tag "${{ steps.meta.outputs.dist_tag }}" --access public --provenance

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists; skipping"
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" --repo "$GITHUB_REPOSITORY"
