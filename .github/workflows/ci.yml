name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm typecheck
      - run: pnpm release:check
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm smoke
      - name: Current and full-history secret scan
        run: pnpm secret:scan
      - name: Production dependency audit
        run: pnpm audit:prod
      - name: Dependency license policy
        run: pnpm license:check
      - name: Generate dependency SBOM
        run: pnpm --silent sbom > sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-node-${{ matrix.node-version }}
          path: sbom.json
          if-no-files-found: error
