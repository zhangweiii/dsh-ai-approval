name: Release readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm typecheck
      - run: pnpm release:check
      - run: pnpm license:check
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm smoke
      - name: Pack release artifact (no publish)
        run: |
          mkdir -p release-artifacts
          pnpm --silent sbom > release-artifacts/sbom.cdx.json
          npm pack --pack-destination release-artifacts
          sha256sum release-artifacts/*.tgz release-artifacts/sbom.cdx.json > release-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-node-${{ matrix.node-version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
