name: Release readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm secret:scan
      - run: pnpm audit:prod
      - run: pnpm test
      - run: pnpm coverage
      - run: pnpm typecheck
      - run: pnpm release:check
      - run: pnpm license:check
      - run: pnpm sbom:check
      - run: pnpm build
      - run: pnpm publint
      - name: Pack and smoke-test exact release artifact (no publish)
        run: |
          rm -rf release-artifacts
          mkdir release-artifacts
          pnpm --silent sbom > release-artifacts/sbom.cdx.json
          npm pack --pack-destination release-artifacts
          (cd release-artifacts && sha256sum *.tgz sbom.cdx.json > SHA256SUMS)
          (cd release-artifacts && sha256sum -c SHA256SUMS)
          node scripts/package-smoke.mjs release-artifacts/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-node-${{ matrix.node-version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
